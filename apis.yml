name: Notional Finance
description: 'Notional Finance is a fixed-rate, fixed-term DeFi lending and borrowing
  protocol built on Ethereum and Arbitrum. The protocol enables users to lend and
  borrow crypto assets at predetermined interest rates using fCash, a zero-coupon
  bond instrument that represents a fixed cash flow at maturity. Notional V3 introduced
  leveraged vaults and expanded yield strategies, making it DeFi''s leading fixed-rate
  lending platform with tenors ranging from three months to twenty years.

  '
