- name: Notional Typescript SDK
  description: 'Client-side Typescript SDK for interacting with Notional Finance smart
    contracts. Provides helper methods for computing fixed-rate trade values including
    getCashAmountGivenfCashAmount, getfCashAmountGivenCashAmount, and getSlippageRate.
    Enables developers to build applications that integrate with Notional''s fixed-rate
    lending and borrowing markets without directly encoding ABI calls.

    '
