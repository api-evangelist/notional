- name: Notional V2 Subgraph API (Mainnet)
  description: 'GraphQL subgraph API for querying Notional V2 on-chain data on Ethereum
    Mainnet via The Graph protocol. Provides access to accounts, trades, markets,
    nTokens, cash groups, currencies, TVL history, exchange rates, and liquidation
    events. Most numerical values use 8-decimal precision (10^8); interest rates use
    9-decimal precision (10^9). Pagination defaults to 100 results per page with a
    maximum of 1000.

    '
